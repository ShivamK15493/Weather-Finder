<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="design.css">
    <link rel="icon" href="temp.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <h1 align="center">Weather Finder</h1>

    <div class="up"> 

        <input type="text" id="search" placeholder="Enter City">
        <button> <i class="fa-solid fa-magnifying-glass"></i></button>

    </div>
    <br>

    <div class="data">

        <div class="output" id="res">
            <center>
                <div class="weaImg">
                    <img src="/Assets/temp.png" alt="">
                </div>
            </center>
            <div align="center" id="hea">

            </div> <br>
            <div id="cit">
            </div>
            <div id="dat">
            </div>

            <div class="area1">
                <div class="feelsLike">
                    <center>
                        <img src="/Assets/feelsLike.png" alt="">
                    </center>
                    <center>
                        <div class="feelFont">
                            Feels Like
                        </div>
                    </center>
                    <center>
                        <div class="feelOutput" id="fee">
                        </div>
                    </center>
                </div>
                <div class="wind">
                    <center>
                        <img src="/Assets/wind.png" alt="">
                    </center>
                    <center>
                        <div class="windFont">
                            Wind Speed
                        </div>
                    </center>
                    <center>
                        <div class="windOutput" id="win">
                        </div>
                    </center>
                </div>
            </div>
            <div class="area2">
                <div class="humidity">
                    <center>
                        <img src="/Assets/humidity.png" alt="">
                    </center>
                    <center>
                        <div class="humidityFont">
                            Humidity
                        </div>
                    </center>
                    <center>
                        <div class="humidityOutput" id="hum">
                        </div>
                    </center>
                </div>
                <div class="pressure">
                    <center>
                        <img src="/Assets/pressure.png" alt="">
                    </center>
                    <center>
                        <div class="pressureFont">
                            - Pressure
                        </div>
                    </center>
                    <center>
                        <div class="pressureOutput" id="pre">
                        </div>
                    </center>
                </div>

            </div>
        </div>
    </div>

    <script src="style.js"></script>
</body>

</html>
